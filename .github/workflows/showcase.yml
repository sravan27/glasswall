name: Showcase Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Glasswall
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate showcase bundle
        run: |
          glasswall showcase \
            examples/showcase/python-legacy \
            examples/showcase/npm-legacy \
            --format json \
            --output site/demo.json
          glasswall showcase \
            examples/showcase/python-legacy \
            examples/showcase/npm-legacy \
            --format markdown \
            --output site/demo.md

      - name: Open showcase refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: glasswall/showcase-refresh
          commit-message: "refresh showcase bundle"
          title: "[glasswall] refresh public showcase bundle"
          body: |
            Refreshes the generated showcase bundle used by GitHub Pages.

            This keeps the public demo tied to real `glasswall showcase` output instead of hand-maintained copy.
          labels: glasswall, docs
