name: "Glasswall"
description: "Patch-gap dependency scanning with SARIF and GitHub job summaries"

inputs:
  path:
    description: "Repository path to scan"
    required: false
    default: "."
  fail-on:
    description: "Urgency threshold that fails the workflow"
    required: false
    default: ""
  policy:
    description: "Optional path to a Glasswall policy file"
    required: false
    default: ""
  upload-sarif:
    description: "Upload the generated SARIF file to GitHub code scanning"
    required: false
    default: "true"
  apply-remediation:
    description: "Apply supported Glasswall remediation changes in-place"
    required: false
    default: "false"
  max-upgrades:
    description: "Maximum number of top remediation recommendations to apply"
    required: false
    default: ""
  python-version:
    description: "Python version used to run Glasswall"
    required: false
    default: "3.12"

outputs:
  sarif-path:
    description: "Path to the generated SARIF report"
    value: ${{ steps.scan.outputs.sarif_path }}
  summary-path:
    description: "Path to the generated markdown summary"
    value: ${{ steps.scan.outputs.summary_path }}
  remediation-summary-path:
    description: "Path to the generated remediation markdown summary"
    value: ${{ steps.scan.outputs.remediation_summary_path }}
  changes-detected:
    description: "Whether supported remediation changes were applied in the working tree"
    value: ${{ steps.scan.outputs.changes_detected }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Glasswall
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install "${{ github.action_path }}"

    - name: Run Glasswall
      id: scan
      shell: bash
      run: |
        set +e
        summary_path="$RUNNER_TEMP/glasswall-summary.md"
        sarif_path="$RUNNER_TEMP/glasswall.sarif"
        remediation_summary_path="$RUNNER_TEMP/glasswall-remediation.md"

        args=(plan "${{ inputs.path }}" --format markdown --output "$summary_path")
        if [[ -n "${{ inputs.policy }}" ]]; then
          args+=(--policy "${{ inputs.policy }}")
        fi
        glasswall "${args[@]}"
        plan_exit=$?

        sarif_args=(scan "${{ inputs.path }}" --format sarif --output "$sarif_path" --no-save)
        if [[ -n "${{ inputs.policy }}" ]]; then
          sarif_args+=(--policy "${{ inputs.policy }}")
        fi
        if [[ -n "${{ inputs.fail-on }}" ]]; then
          sarif_args+=(--fail-on "${{ inputs.fail-on }}")
        fi
        glasswall "${sarif_args[@]}"
        scan_exit=$?

        cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
        changes_detected=false
        if [[ "${{ inputs.apply-remediation }}" == "true" ]]; then
          remediate_args=(remediate "${{ inputs.path }}" --format markdown --output "$remediation_summary_path" --apply)
          if [[ -n "${{ inputs.policy }}" ]]; then
            remediate_args+=(--policy "${{ inputs.policy }}")
          fi
          if [[ -n "${{ inputs.max-upgrades }}" ]]; then
            remediate_args+=(--max-upgrades "${{ inputs.max-upgrades }}")
          fi
          glasswall "${remediate_args[@]}"
          cat "$remediation_summary_path" >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet; then
            changes_detected=true
          fi
        fi
        echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
        echo "sarif_path=$sarif_path" >> "$GITHUB_OUTPUT"
        echo "remediation_summary_path=$remediation_summary_path" >> "$GITHUB_OUTPUT"
        echo "changes_detected=$changes_detected" >> "$GITHUB_OUTPUT"
        if [[ $scan_exit -ne 0 ]]; then
          echo "exit_code=$scan_exit" >> "$GITHUB_OUTPUT"
        else
          echo "exit_code=$plan_exit" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4.37.4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_path }}

    - name: Enforce fail-on threshold
      if: steps.scan.outputs.exit_code != '0'
      shell: bash
      run: exit "${{ steps.scan.outputs.exit_code }}"
